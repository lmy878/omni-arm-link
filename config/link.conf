# omni-arm-link application configuration.
#
# Keys map 1:1 to command line options. CLI options override these values.
# Install to /etc/omni-arm-link/link.conf in production.

[common]
log_level = info
color = true

[robot]
rate = 200
telemetry_tx = 127.0.0.1:5602
debug_tx = 127.0.0.1:5603
control_bind = 0.0.0.0
control_port = 5601
debug_rate = 5
control_timeout_ms = 500
duration = 0
stats_interval = 1
print_rate = 0
measure_latency = true

[controller]
rate = 200
telemetry_bind = 0.0.0.0
telemetry_port = 5612
debug_port = 5613
control_tx = 127.0.0.1:5611
telemetry_timeout_ms = 500
auto_motion = true
interactive = false
duration = 0
stats_interval = 1
print_rate = 0
measure_latency = true

[monitor]
bind = 0.0.0.0
telemetry_port = 5622
debug_port = 5623
control_port = 5621
frame_log = true
duration = 0
stats_interval = 1
measure_latency = true
