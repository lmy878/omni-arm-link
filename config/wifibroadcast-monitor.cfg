# WFB-NG configuration for the third PASSIVE MONITOR node (RTL8812EU).
#
# The monitor is receive-only. It never transmits and must not become a
# dependency of the controller <-> robot link.
#
# Install as /etc/wifibroadcast.cfg on the monitor host, copy BOTH
# drone.key and gs.key to /etc, then start the profile:
#     wifibroadcast@monitor         (systemd)   or   wfb-server monitor <wlan>
#
# Stream map (all receive only):
#   0x01 telemetry  robot -> controller      udp_direct_rx  connect 127.0.0.1:5622
#   0x02 debug      robot -> controller      udp_direct_rx  connect 127.0.0.1:5623
#   0x80 control    controller -> robot      udp_direct_rx  connect 127.0.0.1:5621
#
# Key selection matters: downlink streams are received exactly like the ground
# station (gs.key) while the uplink control stream is received like the robot
# (drone.key). Both keys must be present.

[path]
conf_dir = '/etc'
bin_dir = '/usr/bin'
tmp_dir = '/tmp'
log_dir = '/var/log'

[common]
debug = False
version = 'dev'
commit = 'oal'
primary = True
log_file = None
binary_log_file = None
set_nm_unmanaged = True
radio_mtu = 1445
tunnel_agg_timeout = 0.005
mavlink_agg_timeout = 0.1
mavlink_err_rate = True
log_interval = 1000
tx_sel_rssi_delta = 3
tx_sel_counter_abs_delta = 3
tx_sel_counter_rel_delta = 0.1
tx_rcv_buf_size = 2097152
rx_snd_buf_size = 2097152
wifi_channel = 165
wifi_region = 'BO'
wifi_txpower = 'off'
temp_measurement_interval = 10
temp_overheat_warning = 60

[cluster]
nodes = {}
ssh_user = 'root'
ssh_port = 22
ssh_key = None
custom_init_script = None
server_address = None
base_port_server = 10000
base_port_node = 11000

[base]
stream_rx = None
stream_tx = None
keypair = None
mirror = False
bandwidth = 20
force_vht = False
short_gi = False
stbc = 1
ldpc = 1
mcs_index = 1
use_qdisc = False
fwmark = 0
control_port = 0
injection_retries = 10
injection_retry_delay = 5000

[radio_base]
frame_type = 'data'
fec_k = 8
fec_n = 12
fec_timeout = 0
fec_delay = 0

[drone_base]
keypair = 'drone.key'

[gs_base]
keypair = 'gs.key'

[monitor]
streams = [
    {'name': 'telemetry', 'stream_tx': None, 'stream_rx': 0x01, 'service_type': 'udp_direct_rx',
     'profiles': ['base', 'radio_base', 'gs_base'],
     'peer': 'connect://127.0.0.1:5622'},
    {'name': 'debug', 'stream_tx': None, 'stream_rx': 0x02, 'service_type': 'udp_direct_rx',
     'profiles': ['base', 'radio_base', 'gs_base'],
     'peer': 'connect://127.0.0.1:5623'},
    {'name': 'control', 'stream_tx': None, 'stream_rx': 0x80, 'service_type': 'udp_direct_rx',
     'profiles': ['base', 'radio_base', 'drone_base'],
     'peer': 'connect://127.0.0.1:5621'}
    ]
stats_port = 8004
api_port = 8104
link_domain = 'oal-link'
